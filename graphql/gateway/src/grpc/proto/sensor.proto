syntax = "proto3";

package sensor;

service SensorService {
  rpc RegisterSensor(RegisterSensorRequest) returns (SensorResponse);
  rpc GetSensor(GetSensorRequest) returns (SensorResponse);
  rpc ListSensorsByUser(ListSensorsByUserRequest) returns (ListSensorsResponse);
  rpc UpdateSensorPostcode(UpdatePostcodeRequest) returns (SensorResponse);
}

message RegisterSensorRequest {
  string sensor_id = 1;
  string user_email = 2;
  string postcode = 3;
}

message GetSensorRequest {
  string sensor_id = 1;
}

message ListSensorsByUserRequest {
  string user_email = 1;
}

message UpdatePostcodeRequest {
  string sensor_id = 1;
  string new_postcode = 2;
}

message SensorResponse {
  string sensor_id = 1;
  string user_email = 2;
  string postcode = 3;
  string status = 4;
  int64 registered_at = 5;
  int64 last_updated_at = 6;
}

message ListSensorsResponse {
  repeated SensorResponse sensors = 1;
}