apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "microservices.fullname" . }}-ui-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      containers:
        - name: ui-service
          image: "{{ .Values.uiService.image.repository }}:{{ .Values.uiService.image.tag }}"
          ports:
            - containerPort: {{ .Values.uiService.port }}
          env:
            {{- range $key, $value := .Values.uiService.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
