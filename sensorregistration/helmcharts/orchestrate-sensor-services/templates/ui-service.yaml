apiVersion: v1
kind: Service
metadata:
  name: {{ include "microservices.fullname" . }}-ui-service
spec:
  type: NodePort
  selector:
    app: ui-service
  ports:
    - port: {{ .Values.uiService.port }}
      targetPort: {{ .Values.uiService.port }}
      protocol: TCP
      name: http
      nodePort: {{ .Values.uiService.nodePort }}
