services:
  registration-service:
    image: sbhrwldocker/registration-service:latest
    container_name: registration-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9083:9083"
    environment:
      SERVER_PORT: 9083
      MONGO_HOST: host.docker.internal
      MONGO_PORT: 27017
      MONGO_USERNAME: root
      MONGO_PASSWORD: root123
      SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS: host.docker.internal:29092
      NOTIFICATION_SERVICE_URL: http://host.docker.internal:9084
    depends_on: []
