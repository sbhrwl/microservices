services:
  ui-service:
    build:
      context: .
    image: sbhrwldocker/ui-service:latest
    ports:
      - "9081:9081"
    environment:
      SERVER_PORT: 9081
      # KEYCLOAK_URL: http://host.docker.internal:8080/
      # As Keycloak is a Docker container, so ui-service container needs to talk to it using its service name on the shared network
      KEYCLOAK_URL: http://keycloak:8080/
      KEYCLOAK_REALM: master
      KEYCLOAK_CLIENTID: sensor-service
      SENSOR_SERVICE_URL: http://host.docker.internal:9082
    networks:
      - keycloak_keycloak_net
networks:
  keycloak_keycloak_net:
    external: true
