type Sensor {
  sensorId: String!
  userEmail: String!
  postcode: String!
  status: String!
  registeredAt: String!
  lastUpdatedAt: String!
}

type Query {
  sensor(sensorId: String!): Sensor
  sensorsByUser(userEmail: String!): [Sensor!]!
}

type Mutation {
  registerSensor(
    sensorId: String!
    userEmail: String!
    postcode: String!
  ): Sensor!
  
  updateSensorPostcode(
    sensorId: String!
    newPostcode: String!
  ): Sensor!
}