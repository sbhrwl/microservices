apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      containers:
        - name: ui-service
          image: ui-service:latest
          ports:
            - containerPort: 9081
          env:
            - name: SERVER_PORT
              value: "9081"
            - name: KEYCLOAK_URL
              value: "http://host.docker.internal:8080/"
              # NOTE: 'host.docker.internal' does NOT work inside Kubernetes pods.
              # Replace with the actual service name, cluster IP, or external URL.
            - name: KEYCLOAK_REALM
              value: "master"
            - name: KEYCLOAK_CLIENTID
              value: "sensor-service"
            - name: SENSOR_SERVICE_URL
              value: "http://host.docker.internal:9082"
              # NOTE: Same as above — ensure this URL is reachable from within the cluster.

---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
spec:
  type: NodePort
  selector:
    app: ui-service
  ports:
    - port: 9081
      targetPort: 9081
      nodePort: 30081  # Exposes service on <NodeIP>:30081
