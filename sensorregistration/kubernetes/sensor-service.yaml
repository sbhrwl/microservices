apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-service
  template:
    metadata:
      labels:
        app: sensor-service
    spec:
      containers:
        - name: sensor-service
          image: sbhrwldocker/sensor-service:latest
          ports:
            - containerPort: 9082
          env:
            - name: SERVER_PORT
              value: "9082"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://192.168.0.102:8080/realms/master"
            - name: KEYCLOAK_JWK_SET_URI
              value: "http://192.168.0.102:8080/realms/master/protocol/openid-connect/certs"
            - name: KEYCLOAK_CLIENT_ID
              value: "sensor-service"
            - name: KEYCLOAK_PROVIDER
              value: "keycloak"
            - name: KAFKA_HOST
              value: "192.168.0.102"
            - name: KAFKA_PORT
              value: "29092"
            - name: KAFKA_SENSOR_REG_TOPIC
              value: "sensor-registrations"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:30081,http://192.168.0.102:30081"
              # value: "http://192.168.0.102:9081"
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-service
spec:
  selector:
    app: sensor-service
  ports:
    - protocol: TCP
      port: 9082
      targetPort: 9082
      nodePort: 30082
  type: NodePort