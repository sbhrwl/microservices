apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration-service
  template:
    metadata:
      labels:
        app: registration-service
    spec:
      containers:
        - name: registration-service
          image: registration-service:latest
          ports:
            - containerPort: 9083
          env:
            - name: SERVER_PORT
              value: "9083"
            - name: MONGO_HOST
              value: "host.docker.internal"
              # NOTE: Replace with MongoDB service name or IP accessible inside the cluster
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USERNAME
              value: "root"
            - name: MONGO_PASSWORD
              value: "root123"
            - name: KAFKA_HOST
              value: "host.docker.internal"
              # NOTE: Replace with Kafka service hostname or IP inside the cluster
            - name: KAFKA_PORT
              value: "29092"
            - name: SPRING_KAFKA_CONSUMER_BOOTSTRAP-SERVERS
              value: "host.docker.internal:29092"
              # NOTE: Same as above; ensure this is reachable from pod
            - name: NOTIFICATION_SERVICE_URL
              value: "http://host.docker.internal:9084"
              # NOTE: Update this URL to the internal service name or ClusterIP address in the cluster

---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
spec:
  selector:
    app: registration-service
  ports:
    - protocol: TCP
      port: 9083
      targetPort: 9083
  type: ClusterIP
