apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
data:
  SERVER_PORT: "9084"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: sbhrwldocker/notification-service:latest
          ports:
            - containerPort: 9084
          envFrom:
            - configMapRef:
                name: notification-service-config
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification-service
  ports:
    - protocol: TCP
      port: 9084
      targetPort: 9084
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registration-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registration-service
  template:
    metadata:
      labels:
        app: registration-service
    spec:
      containers:
        - name: registration-service
          image: sbhrwldocker/registration-service:latest
          ports:
            - containerPort: 9083
          env:
            - name: SERVER_PORT
              value: "9083"
            - name: MONGO_HOST
              value: "192.168.0.102"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USERNAME
              value: "root"
            - name: MONGO_PASSWORD
              value: "root123"
            - name: KAFKA_HOST
              value: "192.168.0.102"
            - name: KAFKA_PORT
              value: "29092"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:9084"
---
apiVersion: v1
kind: Service
metadata:
  name: registration-service
spec:
  selector:
    app: registration-service
  ports:
    - protocol: TCP
      port: 9083
      targetPort: 9083
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-service
  template:
    metadata:
      labels:
        app: sensor-service
    spec:
      containers:
        - name: sensor-service
          image: sbhrwldocker/sensor-service:latest
          ports:
            - containerPort: 9082
          env:
            - name: SERVER_PORT
              value: "9082"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://192.168.0.102:8080/realms/master"
            - name: KEYCLOAK_JWK_SET_URI
              value: "http://192.168.0.102:8080/realms/master/protocol/openid-connect/certs"
            - name: KEYCLOAK_CLIENT_ID
              value: "sensor-service"
            - name: KEYCLOAK_PROVIDER
              value: "keycloak"
            - name: KAFKA_HOST
              value: "192.168.0.102"
            - name: KAFKA_PORT
              value: "29092"
            - name: KAFKA_SENSOR_REG_TOPIC
              value: "sensor-registrations"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:30081,http://192.168.0.102:30081"
              # value: "http://192.168.0.102:9081"
---
apiVersion: v1
kind: Service
metadata:
  name: sensor-service
spec:
  selector:
    app: sensor-service
  ports:
    - protocol: TCP
      port: 9082
      targetPort: 9082
      nodePort: 30082
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-service
  template:
    metadata:
      labels:
        app: ui-service
    spec:
      containers:
        - name: ui-service
          image: sbhrwldocker/ui-service:latest
          ports:
            - containerPort: 9081
          env:
            - name: SERVER_PORT
              value: "9081"
            - name: KEYCLOAK_URL
              value: "http://192.168.0.102:8080/"
            - name: KEYCLOAK_REALM
              value: "master"
            - name: KEYCLOAK_CLIENTID
              value: "sensor-service"
            - name: SENSOR_SERVICE_URL
              value: "http://192.168.0.102:30082"
---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
spec:
  type: NodePort
  selector:
    app: ui-service
  ports:
    - port: 9081
      targetPort: 9081
      nodePort: 30081
