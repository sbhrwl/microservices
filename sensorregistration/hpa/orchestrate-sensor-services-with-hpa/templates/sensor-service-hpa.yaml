apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sensor-hpa
  labels:
    app: sensor
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sensor
  minReplicas: {{ .Values.hpa.sensor.minReplicas }}
  maxReplicas: {{ .Values.hpa.sensor.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.sensor.targetCPUUtilizationPercentage }}
