version: '3.8'

services:
  # Keycloak service
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0 
    container_name: keycloakv26
    # FIX: Use 'start --http-enabled=true' to allow unencrypted HTTP access
    # and bypass the required SSL configuration for production mode.
    command: start --http-enabled=true
    restart: always
    environment:
      # Keycloak Admin Credentials (for initial setup)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: your_strong_admin_password

      # Database Configuration (using PostgreSQL service name 'postgres')
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: your_db_password

      # Hostname and Proxy Configuration
      KC_HOSTNAME: keycloak.local
      KC_HOSTNAME_STRICT: 'false'
      
    # Map container ports to host ports
    ports:
      - "8080:8080" # Default HTTP port
      # - "8443:8443" # HTTPS port (not needed with --http-enabled=true)
      
    # Ensure it waits for the database to be up
    depends_on:
      - postgres
      
    # Volume for Keycloak configuration and build files persistence
    volumes:
      - keycloak_data:/opt/keycloak/data

  # PostgreSQL Database service
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: your_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Optional: Map database port to host
    # ports:
    #   - "5432:5432"

# Define Docker volumes for persistence
volumes:
  postgres_data:
  keycloak_data: