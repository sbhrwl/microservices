version: '3.8'

services:
  # Keycloak service
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0 
    container_name: keycloakv26
    # Use 'start --http-enabled=true' to allow unencrypted HTTP access
    command: start --http-enabled=true
    restart: always
    environment:
      # Keycloak Admin Credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: your_strong_admin_password

      # Database Configuration
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: your_db_password

      # --- REMOVED KC_HOSTNAME: keycloak.local ---
      # This allows access via localhost.
      # Setting KC_HOSTNAME_STRICT: 'false' is no longer required either.

    # Map container ports to host ports
    ports:
      - "8080:8080" # Default HTTP port
      
    depends_on:
      - postgres
      
    # Volume for Keycloak configuration and build files persistence
    volumes:
      - keycloak_data:/opt/keycloak/data

  # PostgreSQL Database service
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: your_db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

# Define Docker volumes for persistence
volumes:
  postgres_data:
  keycloak_data: