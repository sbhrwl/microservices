apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion-service
  template:
    metadata:
      labels:
        app: ingestion-service
    spec:
      containers:
        - name: ingestion-service
          image: sbhrwldocker/ingestion-service:latest
          ports:
            - containerPort: 9081
          env:
            - name: SERVER_PORT
              value: "9081"
            - name: ACTIVEMQ_BROKER_URL
              value: "tcp://192.168.0.102:61616"
            - name: ACTIVEMQ_USER
              value: "admin"
            - name: ACTIVEMQ_PASSWORD
              value: "admin"
            - name: ACTIVEMQ_DEFAULT_DESTINATION
              value: "power-quality"
            - name: INFLUXDB_HOST
              value: "http://192.168.0.102:8086"
            - name: INFLUXDB_DATABASE
              value: "power_quality"
            - name: INFLUXDB_USERNAME
              value: "admin"
            - name: INFLUXDB_PASSWORD
              value: "admin123"
            - name: INFLUXDB_SINGLE_MEASUREMENT
              value: "true"

---
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
spec:
  type: NodePort
  selector:
    app: ingestion-service
  ports:
    - port: 9081
      targetPort: 9081
      nodePort: 30081