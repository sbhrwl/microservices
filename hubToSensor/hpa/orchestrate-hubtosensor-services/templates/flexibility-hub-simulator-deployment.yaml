apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.flexibilityHubSimulator.name }}-deployment
  labels:
    app: {{ .Values.flexibilityHubSimulator.name }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.flexibilityHubSimulator.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.flexibilityHubSimulator.name }}
    spec:
      containers:
      - name: {{ .Values.flexibilityHubSimulator.name }}
        image: "{{ .Values.flexibilityHubSimulator.image }}:{{ .Values.flexibilityHubSimulator.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        ports:
        - containerPort: {{ .Values.flexibilityHubSimulator.port }}
        env:
        # External RabbitMQ Connection
        - name: SPRING_RABBITMQ_HOST
          value: "{{ .Values.global.hostIp }}"
        - name: SPRING_RABBITMQ_USERNAME
          value: {{ .Values.rabbitmq.username }}
        - name: SPRING_RABBITMQ_PASSWORD
          value: {{ .Values.rabbitmq.password }}
        - name: FLEX_BRIDGE_EXCHANGE
          value: {{ .Values.rabbitmq.exchange }}
          
        # Messaging Config
        - name: HUB_REQUEST_QUEUE
          value: flexibility-hub.request
        - name: HUB_REQUEST_KEY
          value: flexibility-hub.request
        - name: HUB_RESPONSE_QUEUE
          value: flexibility-hub.response
        - name: HUB_RESPONSE_KEY
          value: flexibility-hub.response
