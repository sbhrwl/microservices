application:
  name: data-api-service

server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mydatabase
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver

  # --- JPA/Hibernate Configuration ---
  jpa:
    hibernate:
      # 'update' attempts to match the schema to your Entities (Use 'validate' or 'none' for production)
      ddl-auto: update 
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    # Set the logging level for your application's base package
    com.apexsphere.dataapiservice: DEBUG 
    # Log SQL statements generated by Hibernate/JPA
    org.hibernate.SQL: debug