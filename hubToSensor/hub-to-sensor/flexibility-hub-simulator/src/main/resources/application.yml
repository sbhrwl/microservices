application:
  name: flexibility-hub-simulator

server:
  port: 8081

spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

messaging:
  rabbitmq:
    # --- Exchange used for all routing ---
    exchange: flexibility-bridge.exchange

    # --- Request Path (Hub -> Connector) ---
    request-queue: flexibility-hub.request
    request-routing-key: flexibility-hub.request

    # --- Response Path (Connector -> Hub) ---
    response-queue: flexibility-hub.response
    response-routing-key: flexibility-hub.response

logging:
  level:
    org.springframework.amqp: INFO
    com.apexsphere.flexibility_hub_simulator: DEBUG
