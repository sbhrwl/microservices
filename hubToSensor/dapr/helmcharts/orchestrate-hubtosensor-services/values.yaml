global:
  # Use host.docker.internal for Docker Desktop / Kubernetes access to host: host.docker.internal
  hostIp: "10.158.22.221"
  replicaCount: 1
  imagePullPolicy: IfNotPresent

rabbitmq:
  connectionString: "amqp://admin:admin@{{ .Values.global.hostIp }}:5672"
  pubsubName: "rabbitmq-pubsub"

postgres:
  host: "{{ .Values.global.hostIp }}"
  port: 5432
  database: "mydatabase"
  username: "myuser"
  password: "mypassword"
  stateStoreName: "postgres-statestore"

services:
  flexibilityHubSimulator:
    name: "flexibility-hub-simulator"
    image: "sbhrwldocker/flexibility-hub-simulator:dapr-latest"
    port: 8081
    nodePort: 30081
    daprRequestTopic: "flexibility-hub.request"
    daprResponseTopic: "flexibility-hub.response"

  flexibilityBridge:
    name: "flexibility-bridge"
    image: "sbhrwldocker/flexibility-bridge:dapr-latest"
    port: 8082
    hubRequestTopic: "flexibility-hub.request"
    connectorRequestTopic: "connector.request"
    connectorResponseTopic: "connector.response"
    hubResponseTopic: "flexibility-hub.response"
    storageServiceHost: "{{ .Values.global.hostIp }}"
    storageServicePort: 9090

  protocolAdapter:
    name: "protocol-adapter"
    image: "sbhrwldocker/protocol-adapter:dapr-latest"
    port: 8083
    connectorRequestTopic: "connector.request"
    connectorResponseTopic: "connector.response"
    hesRequestTopic: "hes.request"
    hesResponseTopic: "hes.response"
    storageServiceHost: "{{ .Values.global.hostIp }}"
    storageServicePort: 9090

  storageService:
    name: "storage-service"
    image: "sbhrwldocker/storage-service:dapr-latest"
    httpPort: 8086
    grpcPort: 9090
    nodePort: 30086
    daprAppId: "storage-service"
    enableStateStore: true

  hesSimulator:
    name: "hes-simulator"
    image: "sbhrwldocker/hes-simulator:dapr-latest"
    port: 8084
    hesRequestTopic: "hes.request"
    hesResponseTopic: "hes.response"
