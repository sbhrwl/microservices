apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.services.hesSimulator.name }}
  labels:
    app: {{ .Values.services.hesSimulator.name }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.services.hesSimulator.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.services.hesSimulator.name }}
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "{{ .Values.services.hesSimulator.name }}"
        dapr.io/app-port: "{{ .Values.services.hesSimulator.port }}"
        dapr.io/pubsub: "{{ .Values.rabbitmq.pubsubName }}"
        dapr.io/config: "dapr-rabbitmq"
    spec:
      containers:
        - name: {{ .Values.services.hesSimulator.name }}
          image: "{{ .Values.services.hesSimulator.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.hesSimulator.port }}
          env:
            - name: SERVER_PORT
              value: "{{ .Values.services.hesSimulator.port }}"
            - name: DAPR_PUBSUB_NAME
              value: "{{ .Values.rabbitmq.pubsubName }}"
            - name: DAPR_HES_REQUEST_TOPIC
              value: "{{ .Values.services.hesSimulator.hesRequestTopic }}"
            - name: DAPR_HES_RESPONSE_TOPIC
              value: "{{ .Values.services.hesSimulator.hesResponseTopic }}"
