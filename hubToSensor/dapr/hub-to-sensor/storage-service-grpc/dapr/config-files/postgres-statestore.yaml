apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: postgres-statestore
  namespace: default
spec:
  type: state.postgresql
  version: v1
  metadata:
    - name: connectionString
      value: |
        host=localhost
        port=5432
        user=myuser
        password=mypassword
        database=mydatabase
        sslmode=disable
    - name: maxOpenConns
      value: "20"
    - name: maxIdleConns
      value: "5"
    - name: idleTimeout
      value: "30s"
