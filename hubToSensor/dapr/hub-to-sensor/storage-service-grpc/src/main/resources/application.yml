application:
  name: storage-service

server:
  port: ${SERVER_PORT:8086}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}

dapr:
  app-id: storage-service
  http:
    port: ${DAPR_HTTP_PORT:3500}
  grpc:
    port: ${DAPR_GRPC_PORT:50001}
  state-store: postgres-statestore

logging:
  level:
    org.springframework.web: INFO
    com.apexsphere.storageservice: DEBUG
