application:
  name: storage-service

server:
  port: ${SERVER_PORT:8086}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:9090}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydatabase}
    username: ${DB_USER:myuser}
    password: ${DB_PASS:mypassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
storage:
  enableStateStore: ${ENABLE_STATE_STORE:true}

dapr:
  app-id: storage-service
  http:
    port: ${DAPR_HTTP_PORT:3500}
  grpc:
    port: ${DAPR_GRPC_PORT:50001}
  state-store: postgres-statestore
  actors:
    enabled: true

logging:
  level:
    org.springframework.web: INFO
    com.apexsphere.storageservice: DEBUG
