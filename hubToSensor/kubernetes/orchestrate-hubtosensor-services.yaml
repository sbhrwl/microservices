# =========================================================================
# 1. STORAGE SERVICE (CRITICAL DEPENDENCY - Must be applied first)
#    (gRPC server accessed internally by flexibility-bridge and protocol-adapter)
# =========================================================================

# --- Storage Service Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service-deployment
  labels:
    app: storage-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      containers:
      - name: storage-service
        image: sbhrwldocker/storage-service:latest
        ports:
        - containerPort: 9090
        env:
        # NOTE: External PostgreSQL Connection
        - name: DB_HOST
          value: "192.168.0.103" 
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: mydatabase
        - name: DB_USER
          value: myuser
          # FIX: Added missing 'name' key for DB_PASS
        - name: DB_PASS
          value: mypassword
        - name: GRPC_SERVER_PORT
          value: "9090"
---
# --- Storage Service ClusterIP Service ---
apiVersion: v1
kind: Service
metadata:
  name: storage-service-service
spec:
  selector:
    app: storage-service
  ports:
    - protocol: TCP
      port: 9090 
      targetPort: 9090
      name: grpc
  # ClusterIP is used because this is an internal-only service
  type: ClusterIP

# =========================================================================
# 2. DATA API SERVICE (Accessed by UI App and connects to PostgreSQL)
# =========================================================================

---
# --- Data API Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-api-deployment
# ... (Data API Deployment unchanged)
    spec:
      containers:
      - name: data-api
        image: sbhrwldocker/data-api:latest
        ports:
        - containerPort: 8085
        env:
        - name: SERVER_PORT
          value: "8085"
        # NOTE: External PostgreSQL Connection
        - name: DB_HOST
          value: "192.168.0.103" 
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: mydatabase
        - name: DB_USER
          value: myuser
        - name: DB_PASS # FIX: Added missing 'name' key for DB_PASS
          value: mypassword
---
# --- Data API NodePort Service (Accessible internally via DNS and externally via 30885) ---
apiVersion: v1
kind: Service
metadata:
  name: data-api-service
  labels:
    app: data-api
spec:
  # CHANGED: Using NodePort to ensure external access via port 30885 for Postman.
  type: NodePort 
  selector:
    app: data-api
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
      nodePort: 30885
      
# =========================================================================
# 3. UI APP (Frontend application accessed externally, connects to Data API)
# =========================================================================

---
# --- UI App Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-app-deployment
# ... (UI App Deployment metadata unchanged)
  template:
    metadata:
      labels:
        app: ui-app
    spec:
      containers:
      - name: ui-app
        image: sbhrwldocker/ui-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
          
        # CRITICAL FIX: Setting back to external K8s NodePort address. 
        # This is necessary because the UI image does not appear to proxy internally.
        - name: BACKEND_URL
          value: "http://192.168.0.103:30885"
---
# --- UI App NodePort Service ---
apiVersion: v1
kind: Service
metadata:
  name: ui-app-service
  labels:
    app: ui-app
spec:
  # NodePort to access the frontend from your browser
  type: NodePort 
  selector:
    app: ui-app
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      nodePort: 30880 # Fixed NodePort adjusted to fall within the K8s default range (30000-32767)

# =========================================================================
# 4. HES SIMULATOR (Connects externally to RabbitMQ)
# =========================================================================

---
# --- HES Simulator Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hes-simulator-deployment
  labels:
    app: hes-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hes-simulator
  template:
    metadata:
      labels:
        app: hes-simulator
    spec:
      containers:
      - name: hes-simulator
        image: sbhrwldocker/hes-simulator:latest
        env:
        # NOTE: External RabbitMQ Connection
        - name: SPRING_RABBITMQ_HOST
          value: "192.168.0.103" 
        - name: SPRING_RABBITMQ_USERNAME
          value: admin
        - name: SPRING_RABBITMQ_PASSWORD
          value: admin
        - name: FLEX_BRIDGE_EXCHANGE
          value: flexibility-bridge.exchange
        - name: HES_REQUEST_INBOUND_QUEUE
          value: hes.request
        - name: HES_REQUEST_OUTBOUND_KEY
          value: hes.request
        - name: HES_RESPONSE_INBOUND_QUEUE
          value: hes.response
        - name: HES_RESPONSE_OUTBOUND_KEY
          value: hes.response

# =========================================================================
# 5. FLEXIBILITY HUB SIMULATOR (Connects externally to RabbitMQ)
# =========================================================================

---
# --- Flexibility Hub Simulator Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexibility-hub-simulator-deployment
  labels:
    app: flexibility-hub-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flexibility-hub-simulator
  template:
    metadata:
      labels:
        app: flexibility-hub-simulator
    spec:
      containers:
      - name: flexibility-hub-simulator
        image: sbhrwldocker/flexibility-hub-simulator:latest
        ports:
        - containerPort: 8081
        env:
        # NOTE: External RabbitMQ Connection
        - name: SPRING_RABBITMQ_HOST
          value: "192.168.0.103" 
        - name: SPRING_RABBITMQ_USERNAME
          value: admin
        - name: SPRING_RABBITMQ_PASSWORD
          value: admin
        - name: FLEX_BRIDGE_EXCHANGE
          value: flexibility-bridge.exchange
        - name: HUB_REQUEST_QUEUE
          value: flexibility-hub.request
        - name: HUB_REQUEST_KEY
          value: flexibility-hub.request
        - name: HUB_RESPONSE_QUEUE
          value: flexibility-hub.response
        - name: HUB_RESPONSE_KEY
          value: flexibility-hub.response
---
# --- Flexibility Hub Simulator Service (Optional) ---
apiVersion: v1
kind: Service
metadata:
  name: flexibility-hub-simulator-service
  labels:
    app: flexibility-hub-simulator
spec:
  selector:
    app: flexibility-hub-simulator
  ports:
    - protocol: TCP
      port: 8081 
      targetPort: 8081
      nodePort: 30881 # Fixed NodePort adjusted to fall within the K8s default range (30000-32767)
  # CHANGED: Use NodePort to allow external access (like cURL or Postman)
  type: NodePort 

# =========================================================================
# 6. FLEXIBILITY BRIDGE (Connects to Storage Service (gRPC) and RabbitMQ)
# =========================================================================

---
# --- Flexibility Bridge Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexibility-bridge-deployment
  labels:
    app: flexibility-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flexibility-bridge
  template:
    metadata:
      labels:
        app: flexibility-bridge
    spec:
      containers:
      - name: flexibility-bridge
        image: sbhrwldocker/flexibility-bridge:latest
        env:
        # NOTE: External RabbitMQ Connection
        - name: SPRING_RABBITMQ_HOST
          value: "192.168.0.103" 
        - name: SPRING_RABBITMQ_USERNAME
          value: admin
        - name: SPRING_RABBITMQ_PASSWORD
          value: admin
        - name: FLEX_BRIDGE_EXCHANGE
          value: flexibility-bridge.exchange
        - name: HUB_REQUEST_INBOUND_QUEUE
          value: flexibility-hub.request
        - name: CONNECTOR_REQUEST_OUTBOUND_KEY
          value: connector.request
        - name: CONNECTOR_RESPONSE_INBOUND_QUEUE
          value: connector.response
        - name: HUB_RESPONSE_OUTBOUND_KEY
          value: flexibility-hub.response

        # NOTE: Internal Storage Service Connection (K8s Service Name)
        - name: STORAGE_SERVICE_HOST
          value: storage-service-service
        - name: STORAGE_SERVICE_PORT
          value: "9090"

# =========================================================================
# 7. PROTOCOL ADAPTER (Connects to Storage Service (gRPC) and RabbitMQ)
# =========================================================================

---
# --- Protocol Adapter Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protocol-adapter-deployment
  labels:
    app: protocol-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: protocol-adapter
  template:
    metadata:
      labels:
        app: protocol-adapter
    spec:
      containers:
      - name: protocol-adapter
        image: sbhrwldocker/protocol-adapter:latest
        env:
        # NOTE: External RabbitMQ Connection
        - name: SPRING_RABBITMQ_HOST
          value: "192.168.0.103" 
        - name: SPRING_RABBITMQ_USERNAME
          value: admin
        - name: SPRING_RABBITMQ_PASSWORD
          value: admin
        - name: FLEX_BRIDGE_EXCHANGE
          value: flexibility-bridge.exchange
        - name: CONNECTOR_REQUEST_INBOUND_QUEUE
          value: connector.request
        - name: HES_REQUEST_OUTBOUND_KEY
          value: hes.request
        - name: HES_RESPONSE_INBOUND_QUEUE
          value: hes.response
        - name: CONNECTOR_RESPONSE_OUTBOUND_KEY
          value: connector.response

        # NOTE: Internal Storage Service Connection (K8s Service Name)
        - name: STORAGE_SERVICE_HOST
          value: storage-service-service
        - name: STORAGE_SERVICE_PORT
          value: "9090"
