---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-orchestrator
  template:
    metadata:
      labels:
        app: task-orchestrator
    spec:
      containers:
        - name: task-orchestrator
          image: sbhrwldocker/task-orchestrator:latest
          ports:
            - containerPort: 9081
          env:
            - name: SERVER_PORT
              value: "9081"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://10.158.22.221:8080/realms/master"
            - name: KEYCLOAK_JWK_SET_URI
              value: "http://10.158.22.221:8080/realms/master/protocol/openid-connect/certs"
            - name: KEYCLOAK_CLIENT_ID
              value: "task-service"
            - name: KEYCLOAK_PROVIDER
              value: "keycloak"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:9081"
            - name: KAFKA_HOST
              value: "host.docker.internal"
            - name: KAFKA_PORT
              value: "29092"
            - name: KAFKA_TASK_REG_TOPIC
              value: "task-topic"
            - name: MONGO_HOST
              value: "host.docker.internal"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USERNAME
              value: "root"
            - name: MONGO_PASSWORD
              value: "root123"

---
apiVersion: v1
kind: Service
metadata:
  name: task-orchestrator
spec:
  type: NodePort
  selector:
    app: task-orchestrator
  ports:
    - port: 9081
      targetPort: 9081
      nodePort: 30081

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: command-orchestrator
  template:
    metadata:
      labels:
        app: command-orchestrator
    spec:
      containers:
        - name: command-orchestrator
          image: sbhrwldocker/command-orchestrator:latest
          ports:
            - containerPort: 9082
          env:
            - name: SERVER_PORT
              value: "9082"
            - name: KAFKA_HOST
              value: "host.docker.internal"
            - name: KAFKA_PORT
              value: "29092"
            - name: KAFKA_TASK_REG_TOPIC
              value: "task-topic"
            - name: KAFKA_COMMAND_TOPIC
              value: "command-topic"
            - name: MONGO_HOST
              value: "host.docker.internal"
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_USERNAME
              value: "root"
            - name: MONGO_PASSWORD
              value: "root123"
            - name: COMMAND_PERSISTENCE_ENABLED
              value: "true"

---
apiVersion: v1
kind: Service
metadata:
  name: command-orchestrator
spec:
  type: ClusterIP
  selector:
    app: command-orchestrator
  ports:
    - port: 9082
      targetPort: 9082

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protocol-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: protocol-gateway
  template:
    metadata:
      labels:
        app: protocol-gateway
    spec:
      containers:
        - name: protocol-gateway
          image: sbhrwldocker/protocol-gateway:latest
          ports:
            - containerPort: 9083
          env:
            - name: SERVER_PORT
              value: "9083"
            - name: KAFKA_HOST
              value: "host.docker.internal"
            - name: KAFKA_PORT
              value: "29092"
            - name: KAFKA_COMMAND_TOPIC
              value: "command-topic"
            - name: PROTOCOL_TYPE
              value: "dlms"
            - name: SENSOR_SIMULATOR_URL
              value: "http://sensor-simulator:9084/simulate"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-simulator
  template:
    metadata:
      labels:
        app: sensor-simulator
    spec:
      containers:
        - name: sensor-simulator
          image: sbhrwldocker/sensor-simulator:latest
          ports:
            - containerPort: 9084
          env:
            - name: SERVER_PORT
              value: "9084"
            - name: SENSOR_SIMULATOR_ENDPOINT
              value: "/simulate"

---
apiVersion: v1
kind: Service
metadata:
  name: sensor-simulator
spec:
  type: ClusterIP
  selector:
    app: sensor-simulator
  ports:
    - port: 9084
      targetPort: 9084
