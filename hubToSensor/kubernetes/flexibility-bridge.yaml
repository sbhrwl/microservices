apiVersion: apps/v1
kind: Deployment
metadata:
  name: flexibility-bridge-deployment
  labels:
    app: flexibility-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flexibility-bridge
  template:
    metadata:
      labels:
        app: flexibility-bridge
    spec:
      containers:
      - name: flexibility-bridge
        # Image from your docker-compose file
        image: sbhrwldocker/flexibility-bridge:latest
        env:
        # --- RabbitMQ Connection (External) ---
        # Using the host IP confirmed in previous steps for RabbitMQ
        - name: SPRING_RABBITMQ_HOST
          value: "192.168.0.103" 
        - name: SPRING_RABBITMQ_USERNAME
          value: admin
        - name: SPRING_RABBITMQ_PASSWORD
          value: admin
          
        # --- Messaging Queues/Keys ---
        - name: FLEX_BRIDGE_EXCHANGE
          value: flexibility-bridge.exchange
        - name: HUB_REQUEST_INBOUND_QUEUE
          value: flexibility-hub.request
        - name: CONNECTOR_REQUEST_OUTBOUND_KEY
          value: connector.request
        - name: CONNECTOR_RESPONSE_INBOUND_QUEUE
          value: connector.response
        - name: HUB_RESPONSE_OUTBOUND_KEY
          value: flexibility-hub.response

        # --- gRPC Client Connection (Internal K8s Service) ---
        # The host name here is the ClusterIP Service name for the storage service
        - name: STORAGE_SERVICE_HOST
          value: storage-service-service
        - name: STORAGE_SERVICE_PORT
          value: "9090"
