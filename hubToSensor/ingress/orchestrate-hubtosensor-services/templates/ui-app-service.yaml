apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.uiApp.name }}-service
  labels:
    app: {{ .Values.uiApp.name }}
spec:
  type: NodePort 
  selector:
    app: {{ .Values.uiApp.name }}
  ports:
    - port: {{ .Values.uiApp.port }}
      targetPort: {{ .Values.uiApp.port }}
      protocol: TCP
      nodePort: {{ .Values.uiApp.nodePort }}
