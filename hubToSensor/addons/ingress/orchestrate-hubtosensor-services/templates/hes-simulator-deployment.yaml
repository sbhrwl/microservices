apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.hesSimulator.name }}-deployment
  labels:
    app: {{ .Values.hesSimulator.name }}
spec:
  replicas: {{ .Values.global.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.hesSimulator.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.hesSimulator.name }}
    spec:
      containers:
      - name: {{ .Values.hesSimulator.name }}
        image: "{{ .Values.hesSimulator.image }}:{{ .Values.hesSimulator.tag }}"
        imagePullPolicy: {{ .Values.global.imagePullPolicy }}
        env:
        # External RabbitMQ Connection
        - name: SPRING_RABBITMQ_HOST
          value: "{{ .Values.global.hostIp }}"
        - name: SPRING_RABBITMQ_USERNAME
          value: {{ .Values.rabbitmq.username }}
        - name: SPRING_RABBITMQ_PASSWORD
          value: {{ .Values.rabbitmq.password }}
        - name: FLEX_BRIDGE_EXCHANGE
          value: {{ .Values.rabbitmq.exchange }}
          
        # Messaging Config
        - name: HES_REQUEST_INBOUND_QUEUE
          value: hes.request
        - name: HES_REQUEST_OUTBOUND_KEY
          value: hes.request
        - name: HES_RESPONSE_INBOUND_QUEUE
          value: hes.response
        - name: HES_RESPONSE_OUTBOUND_KEY
          value: hes.response
