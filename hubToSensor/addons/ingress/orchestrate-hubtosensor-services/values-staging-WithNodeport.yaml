global:
  # The IP address of your host machine where external services (DB, RabbitMQ) are running.
  # This is crucial for services running in Kubernetes to reach external resources.
  hostIp: "10.158.22.221"
  replicaCount: 1
  imagePullPolicy: IfNotPresent
  
db:
  host: "{{ .Values.global.hostIp }}"
  port: "5432"
  name: mydatabase
  user: myuser
  pass: mypassword

rabbitmq:
  host: "{{ .Values.global.hostIp }}"
  username: admin
  password: admin
  exchange: flexibility-bridge.exchange

dataApi:
  name: data-api
  image: sbhrwldocker/data-api
  tag: staging
  serverPort: 8085
  nodePort: 30885
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    cpuTarget: 50
    memoryTarget: 60

uiApp:
  name: ui-app
  image: sbhrwldocker/ui-app
  tag: staging
  port: 8080
  nodePort: 30880 # External port for the UI App
  # The UI app talks directly to the external NodePort of the Data API
  backendUrl: "http://fhs.local/data-api"

flexibilityHubSimulator:
  name: flexibility-hub-simulator
  image: sbhrwldocker/flexibility-hub-simulator
  tag: staging
  port: 8081
  nodePort: 30881
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    cpuTarget: 50
    memoryTarget: 60

flexibilityBridge:
  name: flexibility-bridge
  image: sbhrwldocker/flexibility-bridge
  tag: staging

protocolAdapter:
  name: protocol-adapter
  image: sbhrwldocker/protocol-adapter
  tag: staging

storageService:
  name: storage-service
  image: sbhrwldocker/storage-service
  tag: staging
  grpcPort: 9090

hesSimulator:
  name: hes-simulator
  image: sbhrwldocker/hes-simulator
  tag: staging

ingress:
  enabled: true
  className: "nginx" # Standard Nginx Ingress Controller class
  host: fhs.local # We will use this hostname
  paths:
    # Service Port is the internal Kubernetes Service port (not NodePort)
    dataApi:
      path: /data-api
      servicePort: 8085
    flexibilityHubSimulator:
      path: /simulator
      servicePort: 8081
    uiApp:
      path: /
      servicePort: 8080