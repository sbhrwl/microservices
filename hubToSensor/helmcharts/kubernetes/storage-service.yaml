apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-service-deployment
  labels:
    app: storage-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-service
  template:
    metadata:
      labels:
        app: storage-service
    spec:
      containers:
      - name: storage-service
        # Using the fully qualified image name from your compose file
        image: sbhrwldocker/storage-service:latest
        ports:
        # Port for internal traffic (gRPC)
        - containerPort: 9090
        env:
        # NOTE: Using external PostgreSQL IP
        # Replace 192.168.0.103 with the actual IP address of your external PostgreSQL host.
        - name: DB_HOST
          value: "192.168.0.103" 
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: mydatabase
        - name: DB_USER
          value: myuser
        - name: DB_PASS
          value: mypassword
        - name: GRPC_SERVER_PORT
          value: "9090"
---
apiVersion: v1
kind: Service
metadata:
  name: storage-service-service
spec:
  selector:
    app: storage-service
  ports:
    # Service Port -> Target Port (container port)
    - protocol: TCP
      port: 9090 
      targetPort: 9090
      name: grpc
  type: ClusterIP # Use ClusterIP since this is likely an internal gRPC service