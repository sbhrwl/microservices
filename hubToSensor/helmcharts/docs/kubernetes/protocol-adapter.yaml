apiVersion: apps/v1
kind: Deployment
metadata:
  name: protocol-adapter-deployment
  labels:
    app: protocol-adapter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: protocol-adapter
  template:
    metadata:
      labels:
        app: protocol-adapter
    spec:
      containers:
      - name: protocol-adapter
        # Image from your docker-compose file
        image: sbhrwldocker/protocol-adapter:latest
        env:
        # --- RabbitMQ Connection (External) ---
        # Using the host IP confirmed in previous steps for RabbitMQ
        - name: SPRING_RABBITMQ_HOST
          value: "192.168.0.103" 
        - name: SPRING_RABBITMQ_USERNAME
          value: admin
        - name: SPRING_RABBITMQ_PASSWORD
          value: admin
          
        # --- Messaging Queues/Keys ---
        - name: FLEX_BRIDGE_EXCHANGE
          value: flexibility-bridge.exchange
        - name: CONNECTOR_REQUEST_INBOUND_QUEUE
          value: connector.request
        - name: HES_REQUEST_OUTBOUND_KEY
          value: hes.request
        - name: HES_RESPONSE_INBOUND_QUEUE
          value: hes.response
        - name: CONNECTOR_RESPONSE_OUTBOUND_KEY
          value: connector.response

        # --- gRPC Client Connection (Internal K8s Service) ---
        # The host name is the ClusterIP Service name for the storage service
        - name: STORAGE_SERVICE_HOST
          value: storage-service-service
        - name: STORAGE_SERVICE_PORT
          value: "9090"
