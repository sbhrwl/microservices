# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-api-deployment
  labels:
    app: data-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-api
  template:
    metadata:
      labels:
        app: data-api
    spec:
      containers:
      - name: data-api
        image: sbhrwldocker/data-api:latest
        ports:
        - containerPort: 8085
        env:
        # --- Application Port ---
        - name: SERVER_PORT
          value: "8085"
          
        # --- Database Connection (External) ---
        # Using the host IP confirmed in previous steps
        - name: DB_HOST
          value: "192.168.0.103" 
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: mydatabase
        - name: DB_USER
          value: myuser
        - name: DB_PASS
          value: mypassword

---
# Service (exposes the Deployment via a NodePort)
apiVersion: v1
kind: Service
metadata:
  name: data-api-service
  labels:
    app: data-api
spec:
  # Use NodePort to expose the service externally, which is helpful 
  # for frontends running outside the cluster.
  type: NodePort 
  selector:
    app: data-api
  ports:
    # Service port (used for internal communication)
    - port: 8085
      # Target port on the container (matches the SERVER_PORT env var)
      targetPort: 8085
      protocol: TCP
