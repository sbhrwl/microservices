spring.application.name=protocolgateway
server.port=${SERVER_PORT:9083}

# Kafka consumer configuration
spring.kafka.consumer.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:29092}
spring.kafka.consumer.group-id=protocol-gateway-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Kafka topic to consume commands
kafka.topic.command-dispatch=${KAFKA_COMMAND_TOPIC:command-topic}

# Protocol type (e.g., dlms, lora) configured via env or configmap
protocol.type=${PROTOCOL_TYPE:dlms}
