spring.application.name=Command orchestrator
server.port=${SERVER_PORT:9082}

# Kafka consumer configuration
spring.kafka.consumer.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:29092}
spring.kafka.consumer.group-id=command-orchestration-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

# Topic name
kafka.topic.task-registration=${KAFKA_TASK_REG_TOPIC:task-topic}

# Command persistence toggle
command.persistence.enabled=true

# MongoDB configuration (if commands are persisted)
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=commandorchestrationdb
spring.data.mongodb.username=${MONGO_USERNAME:root}
spring.data.mongodb.password=${MONGO_PASSWORD:root123}
spring.data.mongodb.authentication-database=admin

logging.level.root=INFO
logging.level.org.springframework.kafka=INFO