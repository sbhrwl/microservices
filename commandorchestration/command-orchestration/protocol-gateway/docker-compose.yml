services:
  protocol-gateway:
    image: sbhrwldocker/protocol-gateway:latest
    container_name: protocol-gateway
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9083:9083"
    environment:
      SERVER_PORT: 9083

      # Kafka config
      KAFKA_HOST: host.docker.internal
      KAFKA_PORT: 29092
      KAFKA_COMMAND_TOPIC: command-topic

      # Protocol type and simulator endpoint
      PROTOCOL_TYPE: dlms
      SENSOR_SIMULATOR_URL: http://host.docker.internal:9084/simulate
