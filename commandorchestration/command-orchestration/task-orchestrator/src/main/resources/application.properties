spring.application.name=Task orchestrator
server.port=${SERVER_PORT:9081}

# Keycloak configuration (jwk-set-uri used for validating JWTs)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/master/protocol/openid-connect/certs}
# Optional: client settings (not required for resource server functionality, but useful if you plan to use a client flow)
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/master}
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID:task-service}
spring.security.oauth2.client.registration.keycloak.provider=${KEYCLOAK_PROVIDER:keycloak}


# Kafka configuration
spring.kafka.producer.bootstrap-servers=${KAFKA_HOST:localhost}:${KAFKA_PORT:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
kafka.topic.task-registration=${KAFKA_TASK_REG_TOPIC:task-topic}


# MongoDB configuration
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=taskregistration
spring.data.mongodb.username=${MONGO_USERNAME:root}
spring.data.mongodb.password=${MONGO_PASSWORD:root123}
spring.data.mongodb.authentication-database=admin

logging.level.root=INFO
# CORS allowed origins (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:9081}
