services:
  task-orchestrator:
    image: sbhrwldocker/task-orchestrator:latest
    container_name: task-orchestrator
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9081:9081"
    environment:
      SERVER_PORT: 9081
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/master
      KEYCLOAK_JWK_SET_URI: http://host.docker.internal:8080/realms/master/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: task-service
      KEYCLOAK_PROVIDER: keycloak
      CORS_ALLOWED_ORIGINS: http://localhost:9081
      KAFKA_HOST: host.docker.internal
      KAFKA_PORT: 29092
      KAFKA_TASK_REG_TOPIC: task-topic
      MONGO_HOST: host.docker.internal
      MONGO_PORT: 27017
      MONGO_USERNAME: root
      MONGO_PASSWORD: root123