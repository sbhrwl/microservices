apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: task-orchestrator-hpa
  labels:
    app: task-orchestrator
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: task-orchestrator
  minReplicas: {{ .Values.hpa.taskOrchestrator.minReplicas }}
  maxReplicas: {{ .Values.hpa.taskOrchestrator.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.hpa.taskOrchestrator.targetCPUUtilizationPercentage }}
