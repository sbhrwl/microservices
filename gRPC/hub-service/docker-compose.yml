services:
  hub-service:
    build:
      context: .    
    image: sbhrwldocker/hub-service:latest
    container_name: hub-service-container
    ports:
      - "9082:9082"
      - "50051:50051"
    environment:
      SERVER_PORT: 9082
      GRPC_SERVER_PORT: 50051
      DB_URL: jdbc:postgresql://db:5432/mydatabase
      DB_USERNAME: myuser
      DB_PASSWORD: mypassword
      # --- JPA/Hibernate Configuration Variables ---
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: true
      JPA_FORMAT_SQL: true
      # --- Logging Configuration Variables ---
      LOGGING_LEVEL_APP: INFO
      LOGGING_LEVEL_HIBERNATE_SQL: DEBUG
      LOGGING_LEVEL_HIBERNATE_BIND: TRACE
