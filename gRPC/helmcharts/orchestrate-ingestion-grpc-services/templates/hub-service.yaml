apiVersion: v1
kind: Service
metadata:
  name: {{ include "hub-service.fullname" . }}
  labels:
    {{- include "hub-service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "hub-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http-port
      protocol: TCP
      port: {{ .Values.service.httpPort }}
      targetPort: {{ .Values.service.httpTargetPort }}
    - name: grpc-port
      protocol: TCP
      port: {{ .Values.service.grpcPort }}
      targetPort: {{ .Values.service.grpcTargetPort }}
